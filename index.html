<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Minecraft GUI Editor Mobile</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- ================= TOP HEADER ================= -->
    <header class="mobile-header">
        <button id="btn-open-project" class="header-btn">
            📁 <span class="btn-text">Project</span>
        </button>
        <div class="current-gui-title" id="current-gui-name">anvil.png</div>
        <button id="btn-fit-screen" class="header-btn-icon" title="Căn giữa màn hình">📐</button>
    </header>

    <!-- ================= WORKSPACE CANVAS ================= -->
    <main class="canvas-viewport" id="viewport">
        <canvas id="main-canvas"></canvas>
        <div class="zoom-indicator" id="zoom-text">100%</div>
    </main>

    <!-- ================= FLOATING BUBBLE (LAYER MANAGER) ================= -->
    <div id="layer-bubble" class="floating-bubble" title="Mở danh sách Layer">
        <div class="bubble-inner">
            <span class="bubble-icon">📚</span>
            <span class="bubble-badge" id="layer-count-badge">0</span>
        </div>
    </div>

    <!-- ================= BOTTOM TOOLBAR (CUỘN NGANG) ================= -->
    <nav class="bottom-toolbar">
        <div class="toolbar-scroll">
            <button id="btn-undo" class="tool-btn">↩️ <span>Undo</span></button>
            <button id="btn-redo" class="tool-btn">↪️ <span>Redo</span></button>
            <span class="v-divider"></span>
            
            <label for="img-upload-input" class="tool-btn tool-btn-purple">
                🖼️ <span>Thêm ảnh</span>
            </label>
            <input type="file" id="img-upload-input" accept="image/*" multiple hidden>

            <button id="btn-ai-remove-bg" class="tool-btn tool-btn-ai">🪄 <span>Xóa nền AI</span></button>
            <button id="btn-open-props" class="tool-btn">⚙️ <span>Thuộc tính</span></button>
            <button id="btn-delete" class="tool-btn tool-btn-danger">🗑️ <span>Delete</span></button>
            
            <span class="v-divider"></span>
            <button id="btn-export-png" class="tool-btn tool-btn-green">💾 <span>Export PNG</span></button>
        </div>
    </nav>

    <!-- ================= MODAL 1: PROJECT TREE OVERLAY ================= -->
    <div id="modal-project" class="modal-overlay">
        <div class="modal-sheet modal-project-sheet">
            <div class="sheet-header">
                <h3>📁 Cấu trúc GUI Minecraft</h3>
                <button class="btn-close-modal" id="btn-close-project">✕</button>
            </div>
            <div class="sheet-search">
                <input type="text" id="gui-search-input" placeholder="🔍 Tìm kiếm GUI (ví dụ: anvil, chest...)">
            </div>
            <div class="sheet-content-scroll" id="folder-tree-container">
                <!-- Cây thư mục GUI được render bằng JS -->
            </div>
        </div>
    </div>

    <!-- ================= MODAL 2: LAYER MANAGER OVERLAY ================= -->
    <div id="modal-layers" class="modal-overlay">
        <div class="modal-sheet modal-layers-sheet">
            <div class="sheet-header">
                <h3>📚 Danh sách Layer</h3>
                <button class="btn-close-modal" id="btn-close-layers">✕</button>
            </div>
            <div class="layer-guide-tip">
                💡 <b>Bước 1:</b> Chạm chọn 1 layer. <br>
                💡 <b>Bước 2:</b> Dùng mũi tên ⬆️ / ⬇️ bên dưới để đổi tầng hiển thị.
            </div>
            <div class="sheet-content-scroll" id="layers-list-container">
                <!-- Danh sách layer render tại đây -->
            </div>
            <div class="layer-reorder-footer">
                <button id="btn-layer-up" class="reorder-btn">⬆️ Lên trên</button>
                <button id="btn-layer-down" class="reorder-btn">⬇️ Xuống dưới</button>
            </div>
        </div>
    </div>

    <!-- ================= BOTTOM SHEET: LAYER PROPERTIES (ẢNH 2) ================= -->
    <div id="sheet-properties" class="property-bottom-sheet">
        <div class="sheet-drag-handle" id="prop-drag-close">
            <span class="handle-bar"></span>
        </div>
        <div class="prop-header">
            <h4>THUỘC TÍNH LAYER</h4>
            <button class="btn-close-props" id="btn-close-properties">✕</button>
        </div>
        
        <div class="prop-body">
            <!-- Position -->
            <div class="prop-group">
                <label>Position</label>
                <div class="input-row">
                    <div class="input-box"><span>X</span><input type="number" id="prop-x" value="0"></div>
                    <div class="input-box"><span>Y</span><input type="number" id="prop-y" value="0"></div>
                </div>
            </div>

            <!-- Size -->
            <div class="prop-group">
                <label>Size</label>
                <div class="input-row">
                    <div class="input-box"><span>W</span><input type="number" id="prop-w" value="100"></div>
                    <div class="input-box"><span>H</span><input type="number" id="prop-h" value="100"></div>
                </div>
                <label class="checkbox-label">
                    <input type="checkbox" id="prop-aspect" checked> Khóa tỉ lệ (Lock Aspect)
                </label>
            </div>

            <!-- Transform & Opacity -->
            <div class="prop-group">
                <label>Transform & Opacity</label>
                <div class="input-row">
                    <div class="input-box">
                        <span>Rotate (°)</span>
                        <input type="number" id="prop-rot" value="0">
                    </div>
                </div>
                <div class="opacity-row">
                    <input type="range" id="prop-opacity" min="0" max="1" step="0.01" value="1">
                    <span id="opacity-val">100%</span>
                </div>
            </div>

            <!-- Lật ảnh (Flip) -->
            <div class="prop-group">
                <label>Lật ảnh (Flip)</label>
                <div class="input-row">
                    <button id="btn-flip-h" class="btn-flip">↔️ Flip H</button>
                    <button id="btn-flip-v" class="btn-flip">↕️ Flip V</button>
                </div>
            </div>

            <!-- Thứ tự tầng Layer -->
            <div class="prop-group">
                <label>Thứ tự tầng Layer</label>
                <div class="layer-tip-box" id="layer-status-text">
                    💡 Chưa chọn layer nào.
                </div>
            </div>
        </div>
    </div>

    <!-- Canvas ẩn xuất PNG -->
    <canvas id="export-canvas" style="display:none;"></canvas>

    <!-- Loading Xóa nền AI -->
    <div id="ai-loading" class="ai-loading-overlay" style="display: none;">
        <div class="spinner"></div>
        <div style="font-size: 14px; font-weight: bold; margin-top: 10px;">Đang xóa nền thông minh...</div>
    </div>

    <script src="app.js"></script>
</body>
</html>
